packages:
  - 'apps/*'
  - 'packages/*'
  - 'mcp'

allowBuilds:
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  protobufjs: true
  unrs-resolver: true
  '@scarf/scarf': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@swc/core': true

# pnpm 11+ ignores this in .npmrc and defaults it to 1440 minutes.
minimumReleaseAge: 0
minimumReleaseAgeStrict: false

# Forced versions for vulnerable transitive dependencies (`pnpm audit`).
# Each entry — minimum patched version from advisory; caret keeps change
# within patched major, to not pull incompatible release.
# pnpm 12 reads overrides FROM HERE, not from `pnpm` field of package.json.
#
# `file:` entries — local forks of packages for which upstream didn't release fix
# (advisory without patched versions), so bumping version impossible. Their
# README describes what exactly patched and under what conditions fork removed.
overrides:
  braces: 'file:./vendor/braces'
  ip: 'file:./vendor/ip'
  node-forge: 'file:./vendor/node-forge'
  # Єдина версія TypeScript на весь воркспейс (як було в `pnpm.overrides`).
  next: ^15.5.28
  typescript: 5.9.3
  '@xmldom/xmldom': ^0.8.15
  '@expo/server': ^0.7.5
  'ajv@^8.0.0': ^8.18.0
  body-parser: ^1.20.9
  cookie: ^0.7.0
  decode-uri-component: ^0.5.0
  deepmerge-ts: ^8.0.0
  fast-xml-parser: ^5.12.0
  file-type: ^21.3.2
  glob: ^12.0.0
  # cacache 15 calls util.promisify(require('glob')) at load time. glob 12
  # exports an object, so Node throws ERR_INVALID_ARG_TYPE as soon as npx
  # loads cacache. Keep the callback API for that edge.
  'cacache>glob': 7.2.3
  'rimraf@3>glob': 7.2.3
  handlebars: ^4.7.10
  image-size: ^2.0.3
  js-yaml: ^4.3.2
  lodash: ^4.18.1
  minimatch: ^9.0.7
  multer: ^2.3.0
  picomatch: ^4.0.4
  postcss: ^8.5.23
  postcss-selector-parser: ^7.1.6
  qs: ^6.16.0
  semver: ^7.5.2
  send: ^0.19.0
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
  tar: ^7.5.21
  tmp: ^0.2.6
  uuid: ^11.1.1
  webpack: ^5.104.1
  decode-uri-component@<=0.5.0: ^0.5.1
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  fast-uri@>=3.1.3 <3.1.9: ^3.1.9
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  ip-address@<=10.7.3: ^10.7.4
  joi@>=17.1.1 <17.13.9: ^17.13.9
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  qs@>=6.7.0 <=6.16.0: ^6.16.1
  systeminformation@<5.33.16: ^5.33.16
  '@hono/node-server@>=2.0.0 <2.1.6': ^2.1.6
  hono@<4.13.16: ^4.13.16
  hono@>=3.12.0 <=4.13.15: ^4.13.16
  hono@>=4.1.4 <=4.13.15: ^4.13.16
  hono@>=4.5.1 <=4.13.15: ^4.13.16
