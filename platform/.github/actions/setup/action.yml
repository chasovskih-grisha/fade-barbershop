name: Project setup
description: Install the pnpm workspace and generate the Prisma client
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.1.0
    - uses: actions/setup-node@v4
      with:
        node-version: 20.18.0
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - name: Cache Workspace Package Builds, API dist, Prisma Client, and Next.js Caches
      uses: actions/cache@v4
      with:
        path: |
          apps/web/.next/cache
          apps/admin/.next/cache
          apps/api/dist
          node_modules/.prisma
          packages/*/dist
        key: ${{ runner.os }}-workspace-builds-${{ hashFiles('pnpm-lock.yaml', 'packages/*/package.json', 'apps/*/package.json') }}
        restore-keys: |
          ${{ runner.os }}-workspace-builds-
    - name: Use faster package installation with selective caching
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
    - shell: bash
      run: pnpm --filter @fade/api exec prisma generate
