# Dependabot version updates. This file is read from the default branch.
# Every pull request targets stage (ADR 0052: work lands on stage, main is release-only).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # pnpm workspace: root pnpm-lock.yaml covers apps/*, packages/*, and mcp.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'stage'

  # .github/workflows and .github/actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'stage'

  # infra/docker-compose.yml image tags (floating :latest tags are skipped)
  - package-ecosystem: 'docker'
    directory: '/infra'
    schedule:
      interval: 'weekly'
    target-branch: 'stage'
