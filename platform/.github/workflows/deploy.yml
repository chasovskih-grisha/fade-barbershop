# Deploys api, web and admin to the GMHost VPS with Docker Compose over SSH
# (ADR 0051, ADR 0052, T-4614c). Mobile is not deployed from here.
#
# Only `main` deploys: a push to `stage` runs CI and stops there, because stage
# has no remote host. Production is reached by merging the Release PR.
#
# The GitHub Environment `production` needs:
#   DEPLOY_HOST     — VPS address
#   DEPLOY_USER     — SSH user
#   DEPLOY_SSH_KEY  — private key of that user
#   DEPLOY_PATH     — checkout of this repository on the VPS
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Check deploy secrets
        run: |
          set -eu
          missing=
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Deploy secrets missing::Set$missing on the production environment."
            exit 1
          fi
      - name: Deploy by Compose over SSH
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$DEPLOY_PATH'
            git fetch --prune origin
            git checkout --detach '$SHA'
            docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build --remove-orphans
          "
