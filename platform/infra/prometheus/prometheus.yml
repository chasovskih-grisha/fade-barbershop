# Prometheus — конфіг dev-стека (T-4204b/c). Скрейпить api контейнер
# (fade-platform-net → `api:13000`) раз на 15s. Правила алертів — alerts.yml;
# пороги збігаються з /health outbox (T-042c): pending > 50, oldest > 60s.
# Алерти йдуть в Alertmanager (alertmanager:9093, T-4204c).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: fade-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:13000']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

