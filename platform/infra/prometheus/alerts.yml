# Alert-правила (T-4204b): пороги ідентичні порогам /health outbox-секції
# (OUTBOX_LAG_WARN_PENDING=50, OUTBOX_LAG_WARN_MS=60_000 — outbox-health.contributor.ts).
# Доставка (Alertmanager → Slack/PagerDuty) — окремий крок прод-розгортання;
# у dev алерти видно в UI Prometheus (http://localhost:19090/alerts).
# SLO-група (docs/slo.md): multiwindow burn rate за Google SRE Book — швидке
# спалення (1h+5m вікна, 14.4× бюджету/год) і повільне (6h+30m, 6×).
groups:
  - name: outbox-lag
    rules:
      - alert: OutboxRelayBacklog
        expr: fade_outbox_pending_messages > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox relay backlog: {{ $value }} pending messages'
          description: 'Реле подій не встигає — події життєвого циклу записів затримуються.'

      - alert: OutboxOldestPendingTooOld
        expr: fade_outbox_oldest_pending_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Oldest outbox message is {{ $value | humanizeDuration }} old'
          description: 'Найстаріша неотримана подія старша за 60s — перевірити relay/consumer.'

  - name: slo-burn-rate
    rules:
      # Availability SLO 99.5% (budget 0.5%/28d). Burn 14.4× = весь бюджет за 2 дні.
      - alert: AvailabilityBurnRateFast
        expr: |
          (1 - (sum(rate(fade_http_requests_total{code!~"5xx"}[1h])) / sum(rate(fade_http_requests_total[1h])))) > 0.072
          and
          (1 - (sum(rate(fade_http_requests_total{code!~"5xx"}[5m])) / sum(rate(fade_http_requests_total[5m])))) > 0.072
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Availability burn rate > 14.4x (1h + 5m)'
          description: '5xx-частка спалює 0.5% бюджет за ~2 дні — інцидент (docs/slo.md §3).'

      - alert: AvailabilityBurnRateSlow
        expr: |
          (1 - (sum(rate(fade_http_requests_total{code!~"5xx"}[6h])) / sum(rate(fade_http_requests_total[6h])))) > 0.03
          and
          (1 - (sum(rate(fade_http_requests_total{code!~"5xx"}[30m])) / sum(rate(fade_http_requests_total[30m])))) > 0.03
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Availability burn rate > 6x (6h + 30m)'
          description: 'Стійке спалення бюджету availability — дивитись тренд на SLO-дашборді.'

      # Booking latency SLO 95% (budget 5%/28d): частка /booking-запитів ≥500мс.
      - alert: BookingLatencyBurnRateFast
        expr: |
          (rate(fade_http_booking_slow_total[1h]) / rate(fade_http_requests_total{route="booking"}[1h])) > 0.72
          and
          (rate(fade_http_booking_slow_total[5m]) / rate(fade_http_requests_total{route="booking"}[5m])) > 0.72
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Booking latency burn rate > 14.4x (1h + 5m)'
          description: 'Повільні /booking-запити спалюють 5% бюджет за ~2 дні (docs/slo.md §3).'

      - alert: BookingLatencyBurnRateSlow
        expr: |
          (rate(fade_http_booking_slow_total[6h]) / rate(fade_http_requests_total{route="booking"}[6h])) > 0.3
          and
          (rate(fade_http_booking_slow_total[30m]) / rate(fade_http_requests_total{route="booking"}[30m])) > 0.3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Booking latency burn rate > 6x (6h + 30m)'
          description: 'Стійке спалення бюджету latency booking — перевірити слоти/БД (docs/slo.md §3).'

  # Застосункові алерти (T-6011a): недоступність, 5xx і латентність по застосунках.
  # Недоступність — спільне правило на всі fade-цілі: `up` є для кожного scrape-job,
  # тож правило оживає щойно в prometheus.yml з'являється fade-web/fade-admin.
  - name: apps
    rules:
      - alert: AppTargetDown
        expr: up{job=~"fade-(api|web|admin)"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} is down ({{ $labels.instance }})'
          description: 'Скрап не бачить ціль 2 хвилини — застосунок не відповідає на /metrics.'

      - alert: ApiHigh5xxRate
        expr: |
          sum(rate(fade_http_requests_total{job="fade-api",code="5xx"}[5m]))
          / sum(rate(fade_http_requests_total{job="fade-api"}[5m])) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'api: >5% відповідей 5xx за 5m'
          description: 'Частка серверних помилок api вище 5% — дивитись логи §2 і трейси.'

      - alert: WebPoorLcpShare
        expr: |
          sum(rate(fade_web_vitals_samples_total{job="fade-web",metric="LCP",rating="poor"}[30m]))
          / sum(rate(fade_web_vitals_samples_total{job="fade-web",metric="LCP"}[30m])) > 0.25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'web: >25% семплів LCP у рейтингу poor'
          description: 'Core Web Vitals деградують (T-4204 RUM) — перевірити останній реліз web.'
