# Провайдер дашбордів Grafana (T-4204d): читає JSON із /var/lib/grafana/dashboards
# (bind-mount infra/grafana/dashboards). Оновлення на льоту — restart не потрібен.
apiVersion: 1

providers:
  - name: fade
    folder: Fade
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
